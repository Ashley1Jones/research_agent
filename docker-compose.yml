services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: research-auditor-api
    env_file:
      - development.env
    environment:
      MODEL_HOST_ADDRESS: ollama
      API_BIND_ADDRESS: 0.0.0.0
      POSTGRES_HOST: postgres
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    depends_on:
      - ollama
      - postgres
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; urllib.request.urlopen(f'http://127.0.0.1:{os.environ[\\\"API_PORT\\\"]}/health').read()\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: research-auditor-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: research-auditor-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-research_agent}
      POSTGRES_USER: ${POSTGRES_USER:-research_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-research_agent}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: research-auditor-pgadmin
    profiles:
      - pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - research_agent_pg_data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  ollama_models:
  postgres_data:
  research_agent_pg_data:
