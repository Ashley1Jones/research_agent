services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: research-auditor-api
    env_file:
      - development.env
    environment:
      MODEL_HOST_ADDRESS: ollama
      API_BIND_ADDRESS: 0.0.0.0
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    depends_on:
      - ollama
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; urllib.request.urlopen(f'http://127.0.0.1:{os.environ[\\\"API_PORT\\\"]}/health').read()\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: research-auditor-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_models:
